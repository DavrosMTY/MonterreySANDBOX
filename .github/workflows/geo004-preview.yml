name: GEO-004 public URL verification (free CDN preview)
on:
  push:
    branches: [feature/geo004-topography-audit]
    paths: [.github/publication/geo004-preview.json]
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix WebViewer --no-audit --no-fund
      - name: Check public free service and exact Pages permission documentation
        run: |
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          records=[]
          for name,url in [('cdn','https://raw.githack.com'),('pages_api','https://docs.github.com/en/rest/pages/pages?apiVersion=2022-11-28#create-a-github-pages-site'),('releases','https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases')]:
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=30) as r:body=r.read();status=r.status
              except Exception as error:
                  records.append({'url':url,'error':str(error)});continue
              text=re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',body.decode(errors='replace')))
              patterns=['free service','no formal','Development URLs','CDN URLs'] if name=='cdn' else (['1,000','2 GiB','total size','bandwidth'] if name=='releases' else ['Administration','Pages&quot; repository permissions','write'])
              findings=[]
              for pattern in patterns:
                  i=text.find(pattern)
                  if i>=0:findings.append(text[max(0,i-30):i+170])
              records.append({'url':url,'http_status':status,'sha256':hashlib.sha256(body).hexdigest(),'findings':findings})
          Path('/tmp/geo004-public-sources.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - name: Browser validation of immutable public URL
        working-directory: WebViewer
        run: |
          MOW_GEO004=1 MOW_URL="$(node -p "JSON.parse(require('fs').readFileSync('../.github/publication/geo004-preview.json')).url")" MOW_EVIDENCE=../artifacts/geo004-public npm run test:browser
      - name: Save compact reproducible public verification to task branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('artifacts/geo004-public/browser-report.json')
          if not path.exists():path=Path('artifacts/geo004-public/browser-failure.json')
          report=json.loads(path.read_text()) if path.exists() else {'status':'blocked_before_browser'}
          report['workflow_url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          report['free_service_sources']=json.loads(Path('/tmp/geo004-public-sources.json').read_text())
          report['pages_not_enabled']=True
          Path('docs/geo004').mkdir(parents=True,exist_ok=True)
          Path('docs/geo004/public-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/geo004/public-verification.json
          git commit -m "test(geo004): verify immutable public browser preview and controls"
          git push origin HEAD:feature/geo004-topography-audit
