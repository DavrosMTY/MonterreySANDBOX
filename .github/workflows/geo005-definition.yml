name: GEO-005 official metropolitan definition verification (USD 0)
on:
  push:
    branches: [feature/geo005-metropolitan-foundation]
    paths: [.github/publication/geo005-definition.json]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --no-cache-dir pypdf==6.1.1
      - run: python tools/verify_geo005_definition.py
      - name: Preserve official statistical evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/geo005/metropolitan-definition.json
          git commit -m 'docs(geo005): verify official metropolitan membership from primary publication'
          git push origin HEAD:feature/geo005-metropolitan-foundation
