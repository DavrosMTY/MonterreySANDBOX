name: GEO-004 public verification and release recovery (USD 0)
on:
  push:
    branches: [feature/geo004-topography-audit]
    paths: [.github/publication/geo004-release.json]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MPLCONFIGDIR: /tmp/mow-mpl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies without cache, paid runners or browser download
        run: |
          python -m pip install --no-cache-dir -r requirements.lock.txt
          npm ci --prefix WebViewer --no-audit --no-fund
      - name: Restore exact validated immutable deployment
        run: |
          python - <<'PY'
          import json,subprocess,tarfile
          from pathlib import Path
          c=json.loads(Path('.github/publication/geo004-release.json').read_text());r=json.loads(Path('docs/geo004/ci-verification.json').read_text())
          assert c['source_commit']==r['source_commit'] and c['hosting_commit']==r['hosting_head']
          assert r['browser']['status']=='passed' and r['browser']['geo004']['status']=='passed'
          for commit in (c['hosting_commit'],c['source_commit']):
              assert len(commit)==40 and all(v in '0123456789abcdef'for v in commit)
              subprocess.run(['git','fetch','origin',commit],check=True)
          for name in ('app.js','core.js','topography.js','visual.js','materials.js','decorations.js','background.js','index.html','style.css'):
              assert subprocess.check_output(['git','rev-parse',c['hosting_commit']+':'+name])==subprocess.check_output(['git','rev-parse',c['source_commit']+':WebViewer/src/'+name])
          Path('artifacts').mkdir(exist_ok=True);archive=Path('artifacts/validated-site.tar')
          subprocess.run(['git','archive','--format=tar','--output='+str(archive),c['hosting_commit']],check=True)
          with tarfile.open(archive)as z:z.extractall('artifacts/geo004-site',filter='data')
          PY
      - name: Actual browser against the public immutable URL
        run: |
          MOW_GEO004=1 MOW_URL="$(node -p "JSON.parse(require('fs').readFileSync('.github/publication/geo004-release.json')).url")" MOW_EVIDENCE=artifacts/geo004-public node WebViewer/tests/browser.mjs
      - name: Reconstruct missing runner outputs, require exact previously validated GLB
        run: |
          mkdir -p artifacts/input
          gh release download geo003-world001-3f5c050a07c6 --pattern MonterreyOpenWorld_GEO003_WORLD001.zip --dir artifacts/input
          python tools/prepare_web_source.py --archive artifacts/input/MonterreyOpenWorld_GEO003_WORLD001.zip --output artifacts/source-city --visual --topography
          python -m GeoPipeline.geo004_sources --output artifacts/geo004-dtm
          python -m GeoPipeline.geo004 --terrain artifacts/geo004-dtm --baseline artifacts/source-city --output artifacts/geo004-city
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('docs/geo004/ci-verification.json').read_text());city=json.loads(Path('artifacts/geo004-city/manifest.json').read_text())
          assert city['glb_sha256']==receipt['validation']['source_model_sha256']
          # Existing numerical reports are tied to this identical GLB and native DTM.
          Path('artifacts/geo004-validation').mkdir()
          import shutil
          for p in Path('artifacts/geo004-site/reports').iterdir():
              if p.is_file():shutil.copy2(p,Path('artifacts/geo004-validation')/p.name)
          PY
      - name: Publish and verify download, with retained failure details
        run: |
          export MOW_VALIDATED_SOURCE="$(node -p "JSON.parse(require('fs').readFileSync('.github/publication/geo004-release.json')).source_commit")"
          export MOW_VALIDATED_HOST="$(node -p "JSON.parse(require('fs').readFileSync('.github/publication/geo004-release.json')).hosting_commit")"
          python tools/publish_geo004_release.py --city artifacts/geo004-city --terrain artifacts/geo004-dtm --validation artifacts/geo004-validation --site artifacts/geo004-site --browser artifacts/geo004-public --inputs artifacts/geo004-inputs > artifacts/geo004-release-command.log 2>&1
      - name: Preserve public and release receipts
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path('docs/geo004');workflow='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          for destination,candidates in [('public-verification.json',['artifacts/geo004-public/browser-report.json','artifacts/geo004-public/browser-failure.json']),('release-verification.json',['artifacts/geo004-release-verification.json'])]:
              source=next((Path(p)for p in candidates if Path(p).exists()),None)
              result=json.loads(source.read_text())if source else {'status':'blocked_before_verification'}
              result['workflow_url']=workflow
              if destination.startswith('public'):result['pages_not_enabled']=True
              elif Path('artifacts/geo004-release-command.log').exists()and result.get('status')!='passed':result['failure_details']=Path('artifacts/geo004-release-command.log').read_text()[-6000:]
              (base/destination).write_text(json.dumps(result,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/geo004/public-verification.json docs/geo004/release-verification.json
          git commit -m "test(geo004): verify public preview and downloadable licensed release"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:feature/geo004-topography-audit
