name: WORLD-002 real visual city (USD 0)
on:
  push:
    branches: [feature/world002-visual-identity]
    paths: [.github/publication/world002.json]
  pull_request:
    branches: [development]
    paths: ['WebViewer/**', 'tools/*world002*.py', 'tools/*web*.py', 'tests/test_world002.py', '.github/workflows/world002-web.yml']
permissions:
  contents: read
concurrency:
  group: world002-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  visual:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned dependencies; no cache, paid runner or browser download
        run: |
          python -m pip install --no-cache-dir -r requirements.lock.txt
          npm ci --prefix WebViewer --no-audit --no-fund
      - name: Immutable reviewed GEO-003 source
        run: |
          mkdir -p artifacts/input
          gh release download geo003-world001-3f5c050a07c6 --pattern MonterreyOpenWorld_GEO003_WORLD001.zip --dir artifacts/input
          python tools/prepare_web_source.py --archive artifacts/input/MonterreyOpenWorld_GEO003_WORLD001.zip --output artifacts/source-city --visual
      - name: Build original geometry plus separate visual layer
        run: |
          python tools/build_world002.py --city artifacts/source-city --output artifacts/world002-site
          python tools/validate_web_viewer.py --city artifacts/source-city --site artifacts/world002-site --receipt artifacts/geometry.json
          python tools/validate_world002.py --city artifacts/source-city --site artifacts/world002-site --dem artifacts/world002-inputs/regional-dem.tif --receipt artifacts/visual.json
          python -m pytest -q
          npm test --prefix WebViewer
          python tools/check_publication.py
      - name: Actual Chromium WebGL, visual comparison, streaming and software timing
        env:
          MOW_SITE: artifacts/world002-site
          MOW_EVIDENCE: artifacts/world002-browser
          MOW_WORLD002: '1'
        run: node WebViewer/tests/browser.mjs
      - name: Package authentic captures and validation receipts
        run: python tools/prepare_world002_evidence.py --site artifacts/world002-site --browser artifacts/world002-browser --geometry artifacts/geometry.json --visual artifacts/visual.json
      - name: Publish small generated site preserving hosting history
        if: github.event_name == 'push'
        run: python tools/publish_web_viewer.py --site artifacts/world002-site
      - name: Retain compact CI evidence on task branch (no Actions artifact quota)
        if: always() && github.event_name == 'push'
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          report={'source_commit':os.environ['GITHUB_SHA'],'workflow_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'unreal_executed':False,'paid_services_provisioned':False}
          for name,path in [('geometry','artifacts/geometry.json'),('visual','artifacts/visual.json'),('browser','artifacts/world002-browser/browser-report.json'),('failure','artifacts/world002-browser/browser-failure.json')]:
              if Path(path).exists():report[name]=json.loads(Path(path).read_text())
          report['hosting_head']=subprocess.check_output(['git','ls-remote','origin','refs/heads/gh-pages'],text=True).split()[0]
          Path('docs/world002/ci-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/world002/ci-verification.json
          git commit -m "test(world002): retain real build and browser validation receipts"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:feature/world002-visual-identity
