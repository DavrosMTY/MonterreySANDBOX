name: INFRA-001 public pricing research (no provisioning)
on:
  push:
    branches: [docs/infra001-unreal-infrastructure]
    paths: [.github/publication/infra001-research.json]
permissions:
  contents: read
jobs:
  collect:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read only public official price/documentation URLs
        run: |
          python docs/infra001/research/collect.py
      - name: Version source evidence on this documentation branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/infra001/research/licensing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(infra001): capture dated public pricing and licensing sources"
          git push origin HEAD:docs/infra001-unreal-infrastructure
