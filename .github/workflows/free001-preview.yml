name: FREE-001 public URL verification (free CDN preview)
on:
  push:
    branches: [feature/free001-web-viewer]
    paths: [.github/publication/free001-preview.json]
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'DavrosMTY/MonterreySANDBOX' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix WebViewer --no-audit --no-fund
      - name: Check public free service and exact Pages permission documentation
        run: |
          python - <<'PY'
          import hashlib,json,re,urllib.request
          from pathlib import Path
          records=[]
          for name,url in [('cdn','https://raw.githack.com'),('pages_api','https://docs.github.com/en/rest/pages/pages?apiVersion=2022-11-28#create-a-github-pages-site')]:
              with urllib.request.urlopen(url,timeout=30) as r:body=r.read();status=r.status
              text=re.sub(r'\s+',' ',re.sub('<[^>]+>',' ',body.decode(errors='replace')))
              patterns=['free service','no formal','Development URLs','CDN URLs'] if name=='cdn' else ['Administration','Pages&quot; repository permissions','write']
              findings=[]
              for pattern in patterns:
                  i=text.find(pattern)
                  if i>=0:findings.append(text[max(0,i-30):i+170])
              records.append({'url':url,'http_status':status,'sha256':hashlib.sha256(body).hexdigest(),'findings':findings})
          Path('/tmp/free001-public-sources.json').write_text(json.dumps(records,indent=2))
          print(json.dumps(records,indent=2))
          PY
      - name: Browser validation of immutable public URL
        working-directory: WebViewer
        run: |
          MOW_URL="$(node -p "JSON.parse(require('fs').readFileSync('../.github/publication/free001-preview.json')).url")" MOW_EVIDENCE=../artifacts/free001-public npm run test:browser
      - name: Save compact reproducible public verification to task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads(Path('artifacts/free001-public/browser-report.json').read_text())
          report['workflow_url']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          report['free_service_sources']=json.loads(Path('/tmp/free001-public-sources.json').read_text())
          report['pages_not_enabled']=True
          Path('docs/free001/public-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/free001/public-verification.json
          git commit -m "test(free001): verify immutable public browser preview and controls"
          git push origin HEAD:feature/free001-web-viewer
